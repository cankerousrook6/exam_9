databaseChangeLog:

  - changeSet:
      id: 002
      author: student

      changes:

        - createTable:
            tableName: service_accounts

            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: provider
                  type: varchar(30)

                  constraints:
                    nullable: false

              - column:
                  name: requisite
                  type: varchar(50)

                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: decimal(19,2)
                  defaultValueNumeric: 0

                  constraints:
                    nullable: false


        - addUniqueConstraint:
            tableName: service_accounts
            columnNames: provider, requisite
            constraintName: uq_service_provider_requisite


        - insert:
            tableName: service_accounts

            columns:

              - column:
                  name: provider
                  value: MEGACOM

              - column:
                  name: requisite
                  value: "0555123456"

              - column:
                  name: balance
                  valueNumeric: 0


        - insert:
            tableName: service_accounts

            columns:

              - column:
                  name: provider
                  value: BEELINE

              - column:
                  name: requisite
                  value: "0777123456"

              - column:
                  name: balance
                  valueNumeric: 0


        - insert:
            tableName: service_accounts

            columns:

              - column:
                  name: provider
                  value: SAIMA

              - column:
                  name: requisite
                  value: "100001"

              - column:
                  name: balance
                  valueNumeric: 0