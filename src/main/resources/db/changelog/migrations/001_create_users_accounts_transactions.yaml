databaseChangeLog:

  - changeSet:
      id: 001
      author: student

      changes:

        - createTable:
            tableName: users

            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: varchar(50)

                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: varchar(255)

                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: varchar(20)

                  constraints:
                    nullable: false


        - createTable:
            tableName: accounts

            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_number
                  type: varchar(6)

                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: currency
                  type: varchar(10)

                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: decimal(19,2)

                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: bigint

                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_accounts_user
            onDelete: CASCADE


        - addUniqueConstraint:
            tableName: accounts
            columnNames: user_id, currency
            constraintName: uq_account_user_currency


        - createTable:
            tableName: transactions

            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: type
                  type: varchar(30)

                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(20)

                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: decimal(19,2)

                  constraints:
                    nullable: false

              - column:
                  name: received_amount
                  type: decimal(19,2)

              - column:
                  name: currency
                  type: varchar(10)

                  constraints:
                    nullable: false

              - column:
                  name: exchange_rate
                  type: decimal(19,6)

              - column:
                  name: created_at
                  type: timestamp

                  constraints:
                    nullable: false

              - column:
                  name: sender_account_id
                  type: bigint

              - column:
                  name: receiver_account_id
                  type: bigint

              - column:
                  name: description
                  type: varchar(255)


        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: sender_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_transactions_sender


        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: receiver_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_transactions_receiver